name: test

# Installs the packages from a successful "build" run into a clean debian:trixie container.
# Both test scripts and packages are always resolved from the same source commit.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:   # re-test the latest successful main-branch build without rebuilding

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve the build run and source commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_run ]; then
            id="${{ github.event.workflow_run.id }}"
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            json=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success \
              --branch main --event push -L 1 --json databaseId,headSha -q '.[0]')
            id=$(jq -r '.databaseId // empty' <<<"$json")
            sha=$(jq -r '.headSha // empty' <<<"$json")
          fi
          [ -n "$id" ] && [ -n "$sha" ] || { echo "No successful main build found" >&2; exit 1; }
          echo "Testing artifacts of build run $id (commit $sha)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.sha }}

      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: out
          merge-multiple: true

      - name: Install packages and run checks in debian:trixie
        run: docker run --rm -v "$PWD":/kit -w /kit debian:trixie bash ci/container-test.sh
