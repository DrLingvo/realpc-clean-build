name: installer-release

# Reuses verified QEMU/OVMF/ACPI artifacts only when every userspace build input is
# identical. The installer and kernel tools always come from the dispatched main commit.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'successful build run id for binary reuse (blank = latest main build)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve source and artifact commits
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF_NAME" = main ] || { echo "Dispatch installer releases only from main" >&2; exit 1; }
          id="${{ github.event.inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success --branch main --event push \
              -L 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$id" ] || { echo "No successful build run found" >&2; exit 1; }
          json=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json conclusion,headSha,workflowName)
          [ "$(jq -r .conclusion <<<"$json")" = success ] || { echo "Build run $id is not successful" >&2; exit 1; }
          [ "$(jq -r .workflowName <<<"$json")" = build ] || { echo "Run $id is not a build run" >&2; exit 1; }
          artifact_sha=$(jq -r .headSha <<<"$json")
          release_sha="$GITHUB_SHA"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Installer source: $release_sha; binary artifacts: build $id ($artifact_sha)"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.release_sha }}
          path: source

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.artifact_sha }}
          path: artifact-source

      - name: Require identical userspace recipes
        id: recipe
        env:
          ARTIFACT_SHA: ${{ steps.run.outputs.artifact_sha }}
          RELEASE_SHA: ${{ steps.run.outputs.release_sha }}
        run: |
          # Use the same current hash implementation for both trees. The hash utility is
          # deliberately not itself a binary recipe input.
          cp source/tools/source-hash.sh artifact-source/tools/source-hash.sh
          (cd source && bash tools/source-hash.sh --userspace) > new-recipe.txt
          (cd artifact-source && bash tools/source-hash.sh --userspace) > old-recipe.txt
          new_hash=$(awk '/^RECIPE-SHA256:/{print $2}' new-recipe.txt)
          old_hash=$(awk '/^RECIPE-SHA256:/{print $2}' old-recipe.txt)
          [ -n "$new_hash" ] && [ "$new_hash" = "$old_hash" ] || {
            echo "Userspace recipes differ; installer-only reuse is forbidden" >&2
            diff -u old-recipe.txt new-recipe.txt || true
            exit 1
          }
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"
          echo "Verified identical userspace recipe $new_hash"
          echo "Binary source $ARTIFACT_SHA; installer/kernel source $RELEASE_SHA"

      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Stage installer-only release
        run: |
          shopt -s nullglob
          qemu=(dist/pve-qemu-kvm_*_amd64.deb)
          ovmf=(dist/pve-edk2-firmware-ovmf_*_all.deb)
          [ "${#qemu[@]}" -eq 1 ] || { echo "Expected exactly one QEMU amd64 package" >&2; exit 1; }
          [ "${#ovmf[@]}" -eq 1 ] || { echo "Expected exactly one OVMF package" >&2; exit 1; }
          for file in ssdt.aml ssdt-ec.aml hpet.aml wsmt.aml qemu-applied.diff edk2-applied.diff seabios-applied.diff; do
            [ -s "dist/$file" ] || { echo "Missing or empty required artifact: $file" >&2; exit 1; }
          done
          mkdir -p rel
          cp "${qemu[@]}" "${ovmf[@]}" rel/
          cp dist/ssdt.aml dist/ssdt-ec.aml dist/hpet.aml dist/wsmt.aml dist/*-applied.diff rel/
          tar -C source/kernel --exclude='./out' --exclude='./__pycache__' -czf rel/realpc-kernel-tools.tar.gz .
          cp source/deploy/realpc-setup.sh source/deploy/install-userspace.sh rel/
          printf '%s\n' "${{ steps.run.outputs.release_sha }}" > rel/SOURCE-COMMIT
          printf '%s\n' "${{ steps.run.outputs.artifact_sha }}" > rel/ARTIFACT-SOURCE-COMMIT
          printf '%s\n' "${{ steps.recipe.outputs.hash }}" > rel/USERSPACE-RECIPE-SHA256
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}" > rel/BUILD-RUN-URL
          (cd rel && sha256sum ./* > SHA256SUMS)
          ls -la rel

      - name: Tag name
        id: tag
        run: echo "name=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Installer-only release for the pve-emu-realpc stack (PVE 9 / QEMU 11.1.3-4).
          QEMU/OVMF/ACPI artifacts are reused from BUILD-RUN-URL only after an exact
          userspace recipe-hash match. USERSPACE-RECIPE-SHA256 records that hash.
          SOURCE-COMMIT identifies the installer and kernel tools; ARTIFACT-SOURCE-COMMIT
          identifies the source used for the reused binary artifacts. SHA256SUMS covers
          every release file.

          Update an existing installation while preserving its recorded normal/strong mode:
            bash realpc-setup.sh --mode update --release ${{ steps.tag.outputs.name }} --yes
          Apply the VM configuration separately after update:
            bash realpc-setup.sh --mode configvm --vmid VMID --yes
          Manual rollback:
            bash realpc-setup.sh --mode rollback --yes

          Stop every VM before a Strong update. Keep /root/realpc and its rollback backups.
          The installer never automatically reboots the host. A full VM stop/start is needed
          for userspace, ACPI, and sensor changes; update does not rewrite VM args by itself.

          Detection limits remain: CPUID/VM-exit median latency is still visible on ordinary
          KVM. Complete VM invisibility is not claimed.
          EOF
          )
          gh release create "${{ steps.tag.outputs.name }}" rel/* \
            -R "$GITHUB_REPOSITORY" -t "${{ steps.tag.outputs.name }}" -n "$notes"
