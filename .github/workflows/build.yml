name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'profiles/**'
      - 'deploy/**'
      - 'kernel/**'
      - 'LICENSE'
      - '.github/workflows/test.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/quality.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'profiles/**'
      - 'deploy/**'
      - 'kernel/**'
      - 'LICENSE'
      - '.github/workflows/test.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

# Only one build per ref; a newer push cancels an in-progress older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        stage: [qemu, edk2]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      # Compiler cache: the dominant cost is recompiling QEMU/edk2. ccache makes an unchanged-
      # source rebuild near-instant. Keyed per-run so each run refreshes it; restore-keys pull
      # the most recent previous cache.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache
          key: ccache-${{ matrix.stage }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.stage }}-

      # Source clones (pve-qemu + submodules, pve-edk2 + submodules). Only the .git object
      # stores are kept (the container trims working trees after the build), so this is bounded
      # and lets the next run skip re-downloading gigabytes. Keyed on the pinned commits only,
      # so changing build options in config.env does not invalidate the clone cache.
      - name: Source cache key from pinned commits
        id: pin
        run: echo "key=$(grep -E '^PVE_(QEMU|EDK2)_COMMIT=' config.env | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore sources
        uses: actions/cache@v4
        with:
          path: .cache/work
          key: src-${{ matrix.stage }}-${{ steps.pin.outputs.key }}
          restore-keys: src-${{ matrix.stage }}-

      - name: Build ${{ matrix.stage }} in debian:trixie
        run: |
          stages="${{ matrix.stage }}"
          [ "$stages" = edk2 ] && stages="edk2 acpi"
          # exercise the host-sensors patch in CI (verifies it applies + compiles);
          # the committed default in config.env stays off
          [ "$stages" = qemu ] && sed -i 's/^HOST_SENSORS=0/HOST_SENSORS=1/' config.env
          mkdir -p .cache/ccache .cache/work
          docker run --rm -v "$PWD":/kit -w /kit \
            -v "$PWD/.cache/ccache":/ccache -e CCACHE_DIR=/ccache \
            -v "$PWD/.cache/work":/build -e WORK=/build \
            debian:trixie bash ci/container-build.sh "$stages"
          # make the caches readable by the (non-root) runner user for the cache save step
          sudo chown -R "$(id -u):$(id -g)" .cache

      - uses: actions/upload-artifact@v5
        with:
          name: out-${{ matrix.stage }}
          path: |
            out/*.deb
            out/*.aml
            out/*.diff
            out/SHA256SUMS*
          if-no-files-found: error
