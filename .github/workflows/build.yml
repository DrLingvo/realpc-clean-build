name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tests/**', 'ci/container-test.sh', '.github/workflows/test.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        stage: [qemu, edk2]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Build ${{ matrix.stage }} in debian:trixie
        run: |
          stages="${{ matrix.stage }}"
          [ "$stages" = edk2 ] && stages="edk2 acpi"
          # exercise the host-sensors patch in CI (verifies it applies + compiles);
          # the committed default in config.env stays off
          [ "$stages" = qemu ] && sed -i 's/^HOST_SENSORS=0/HOST_SENSORS=1/' config.env
          docker run --rm -v "$PWD":/kit -w /kit debian:trixie bash ci/container-build.sh "$stages"

      - uses: actions/upload-artifact@v5
        with:
          name: out-${{ matrix.stage }}
          path: |
            out/*.deb
            out/*.aml
            out/*.diff
            out/SHA256SUMS*
          if-no-files-found: error
