name: release

# Publishes a GitHub Release with the built packages from the latest successful "build" run.
# Trigger by pushing a tag (git tag v... && git push --tags) or from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build run id to release or reuse (blank = latest successful)'
        required: false
      installer_only:
        description: 'reuse binaries; take installer/kernel tools from dispatched main'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.inputs.run_id }}"
          installer_only="${{ github.event.inputs.installer_only }}"
          if [ "${{ github.event_name }}" = push ]; then
            # A tag release must contain artifacts built from the tagged commit, never merely
            # the latest successful build of some other main-branch state.
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success -L 100 \
              --json databaseId,headSha -q ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" | head -1)
            [ -n "$id" ] || { echo "No successful build for tagged commit $GITHUB_SHA" >&2; exit 1; }
          elif [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success --branch main --event push \
              -L 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$id" ] || { echo "No successful build run found" >&2; exit 1; }
          json=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json conclusion,headSha,workflowName)
          [ "$(jq -r .conclusion <<<"$json")" = success ] || { echo "Build run $id is not successful" >&2; exit 1; }
          [ "$(jq -r .workflowName <<<"$json")" = build ] || { echo "Run $id is not a build run" >&2; exit 1; }
          artifact_sha=$(jq -r .headSha <<<"$json")
          release_sha="$artifact_sha"
          if [ "$installer_only" = true ]; then
            [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" = main ] \
              || { echo "Installer-only releases must be dispatched from main" >&2; exit 1; }
            release_sha="$GITHUB_SHA"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "installer_only=$installer_only" >> "$GITHUB_OUTPUT"
          echo "Artifacts: build $id ($artifact_sha); installer source: $release_sha"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.release_sha }}
          path: source

      - uses: actions/checkout@v5
        if: ${{ steps.run.outputs.installer_only == 'true' }}
        with:
          ref: ${{ steps.run.outputs.artifact_sha }}
          path: artifact-source

      - name: Verify installer-only artifact reuse
        id: recipe
        if: ${{ steps.run.outputs.installer_only == 'true' }}
        run: |
          # Compare binary recipe inputs, excluding host-built kernel tools and runtime
          # VM-profile tools. make-logo.py remains included because it changes firmware.
          # Both trees use the same implementation.
          userspace_hash() (
            set -euo pipefail
            cd "$1"
            bash tools/source-hash.sh | awk '/^  / {
              sub(/^  /, "")
              if ($2 !~ /^kernel\// && $2 != "ci/container-kvm.sh" && \
                  ($2 !~ /^tools\// || $2 == "tools/make-logo.py")) print
            }' | sha256sum | awk '{print $1}'
          )
          kernel_hash() (
            set -euo pipefail
            cd "$1"
            bash tools/source-hash.sh | awk '/^  / {
              sub(/^  /, "")
              if ($2 ~ /^kernel\// || $2 == "ci/container-kvm.sh" || \
                  $2 == ".github/workflows/build.yml") print
            }' | sha256sum | awk '{print $1}'
          )
          new_hash=$(userspace_hash source)
          old_hash=$(userspace_hash artifact-source)
          [ -n "$new_hash" ] && [ "$new_hash" = "$old_hash" ] || {
            echo "Userspace recipes differ; installer-only reuse is forbidden" >&2
            exit 1
          }
          new_kernel_hash=$(kernel_hash source)
          old_kernel_hash=$(kernel_hash artifact-source)
          [ -n "$new_kernel_hash" ] && [ "$new_kernel_hash" = "$old_kernel_hash" ] || {
            echo "Kernel recipes differ; prebuilt KVM reuse is forbidden" >&2
            exit 1
          }
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"
          echo "kernel_hash=$new_kernel_hash" >> "$GITHUB_OUTPUT"
          echo "Verified identical userspace recipe $new_hash"
          echo "Verified identical prebuilt KVM recipe $new_kernel_hash"

      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Stage files and checksums
        run: |
          shopt -s nullglob
          qemu=(dist/pve-qemu-kvm_*_amd64.deb)
          ovmf=(dist/pve-edk2-firmware-ovmf_*_all.deb)
          kvm=(dist/kvm-*.ko)
          kvm_info=(dist/kvm-*.modinfo)
          [ "${#qemu[@]}" -eq 1 ] || { echo "Expected exactly one QEMU amd64 package" >&2; exit 1; }
          [ "${#ovmf[@]}" -eq 1 ] || { echo "Expected exactly one OVMF package" >&2; exit 1; }
          [ "${#kvm[@]}" -eq 1 ] || { echo "Expected exactly one prebuilt KVM module" >&2; exit 1; }
          [ "${#kvm_info[@]}" -eq 1 ] || { echo "Expected exactly one prebuilt KVM metadata file" >&2; exit 1; }
          for file in ssdt.aml wsmt.aml qemu-applied.diff edk2-applied.diff seabios-applied.diff; do
            [ -s "dist/$file" ] || { echo "Missing or empty required artifact: $file" >&2; exit 1; }
          done
          mkdir -p rel
          cp "${qemu[@]}" "${ovmf[@]}" "${kvm[@]}" "${kvm_info[@]}" rel/
          cp dist/ssdt.aml dist/wsmt.aml dist/*-applied.diff rel/
          # Normal releases use the same commit for everything. Installer-only releases
          # take host-side tools from main and reuse binaries only after the hash guard.
          tar -C source/kernel --exclude='./out' --exclude='./__pycache__' -czf rel/realpc-kernel-tools.tar.gz .
          tar -C source/tools -czf rel/realpc-vm-tools.tar.gz gen-profile.py disk_identity.py vm-config.py chipset_map.py smbios_tables.py consistency_lint.py
          cp source/deploy/realpc-setup.sh source/deploy/install-userspace.sh rel/
          cp source/tests/guest_audit.ps1 rel/
          printf '%s\n' "${{ steps.run.outputs.release_sha }}" > rel/SOURCE-COMMIT
          printf '%s\n' "${{ steps.run.outputs.artifact_sha }}" > rel/ARTIFACT-SOURCE-COMMIT
          if [ "${{ steps.run.outputs.installer_only }}" = true ]; then
            printf '%s\n' "${{ steps.recipe.outputs.hash }}" > rel/USERSPACE-RECIPE-SHA256
            printf '%s\n' "${{ steps.recipe.outputs.kernel_hash }}" > rel/KVM-RECIPE-SHA256
          fi
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}" > rel/BUILD-RUN-URL
          ( cd rel && sha256sum ./* > SHA256SUMS )
          ls -la rel

      - name: Tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Open, source-built packages for the pve-emu-realpc stack (PVE 9 / QEMU 11.1.3-4).
          SOURCE-COMMIT and BUILD-RUN-URL identify the exact sources and CI run. The applied
          diffs and SHA256SUMS are included.

          Transactional install on a Proxmox VE 9 host (downloads and verifies this release):
            bash realpc-setup.sh --mode normal --release ${{ steps.tag.outputs.name }} --yes
            bash realpc-setup.sh --mode configvm --vmid VMID --yes
          Manual rollback:
            bash realpc-setup.sh --mode rollback --yes

          The installer requires SHA256SUMS, backs up the exact original packages and their
          hold state, and automatically rolls back an incomplete operation. Keep the work
          directory (/root/realpc by default): it contains the rollback backups.

          host-sensors is available on Intel hosts and includes thermal/performance/RAPL MSRs.
          Strong defaults to a prebuilt kvm.ko only when kernelrelease, vermagic, config and
          Module.symvers match the host. Unsupported kernels require the explicit --kvm-build
          fallback. Strong is experimental, affects every VM, and CI artifacts are not boot tests.

          Detection limits remain: CPUID/VM-exit median latency is still visible on ordinary
          KVM. No release can promise full VM invisibility; run tests/timing_tests on the real
          guest and treat ERROR/incomplete results as a failed test run, not as a pass.
          EOF
          )
          if [ "${{ steps.run.outputs.installer_only }}" = true ]; then
            notes="Installer-only release: verified QEMU/OVMF/ACPI artifacts are reused after a userspace recipe-hash match. SOURCE-COMMIT identifies installer/kernel tools; ARTIFACT-SOURCE-COMMIT identifies binary sources."$'\n\n'"$notes"
          fi
          gh release create "${{ steps.tag.outputs.name }}" rel/* \
            -R "$GITHUB_REPOSITORY" -t "${{ steps.tag.outputs.name }}" -n "$notes"
