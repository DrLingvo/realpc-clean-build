name: release

# Publishes a GitHub Release with the built packages from the latest successful "build" run.
# Trigger by pushing a tag (git tag v... && git push --tags) or from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build run id to release (blank = latest successful)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success -L 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Releasing artifacts from build run $id"

      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Stage files and checksums
        run: |
          mkdir -p rel
          cp dist/*.deb dist/*.aml rel/ 2>/dev/null || true
          cp dist/*.diff rel/ 2>/dev/null || true
          ( cd rel && sha256sum ./* > SHA256SUMS )
          ls -la rel

      - name: Tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Open, source-built packages for the pve-emu-realpc stack (PVE 9 / QEMU 11.1.3-4).
          Built in CI from official Proxmox sources; see the build run for the exact edits
          (qemu-applied.diff, edk2-applied.diff, seabios-applied.diff).

          Install on a Proxmox VE 9 host:
            dpkg -i pve-qemu-kvm_*.deb pve-edk2-firmware-ovmf_*_all.deb
            apt-mark hold pve-qemu-kvm pve-edk2-firmware-ovmf
            cp ssdt.aml ssdt-ec.aml hpet.aml /root/
          Revert: apt-mark unhold ... && apt reinstall pve-qemu-kvm pve-edk2-firmware-ovmf

          pve-qemu-kvm here is built with the host-sensors CPU property available (Intel):
          add host-sensors=on to the VM's -cpu to show host temp/MHz/power in the guest.
          This does NOT include the closed Strong kvm.ko; see kernel/ in the repo for the
          open kernel patch you build on the host.
          EOF
          )
          gh release create "${{ steps.tag.outputs.name }}" rel/* \
            -R "$GITHUB_REPOSITORY" -t "${{ steps.tag.outputs.name }}" -n "$notes"
