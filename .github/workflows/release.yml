name: release

# Publishes a GitHub Release with the built packages from the latest successful "build" run.
# Trigger by pushing a tag (git tag v... && git push --tags) or from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build run id to release (blank = latest successful)'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ github.event.inputs.run_id }}"
          if [ "${{ github.event_name }}" = push ]; then
            # A tag release must contain artifacts built from the tagged commit, never merely
            # the latest successful build of some other main-branch state.
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success -L 100 \
              --json databaseId,headSha -q ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" | head -1)
            [ -n "$id" ] || { echo "No successful build for tagged commit $GITHUB_SHA" >&2; exit 1; }
          elif [ -z "$id" ]; then
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w build -s success --branch main --event push \
              -L 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$id" ] || { echo "No successful build run found" >&2; exit 1; }
          conclusion=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)
          [ "$conclusion" = success ] || { echo "Build run $id is not successful" >&2; exit 1; }
          sha=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing artifacts from build run $id (commit $sha)"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.sha }}

      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Stage files and checksums
        run: |
          shopt -s nullglob
          qemu=(dist/pve-qemu-kvm_*_amd64.deb)
          ovmf=(dist/pve-edk2-firmware-ovmf_*_all.deb)
          [ "${#qemu[@]}" -eq 1 ] || { echo "Expected exactly one QEMU amd64 package" >&2; exit 1; }
          [ "${#ovmf[@]}" -eq 1 ] || { echo "Expected exactly one OVMF package" >&2; exit 1; }
          for file in ssdt.aml ssdt-ec.aml hpet.aml wsmt.aml qemu-applied.diff edk2-applied.diff seabios-applied.diff; do
            [ -s "dist/$file" ] || { echo "Missing or empty required artifact: $file" >&2; exit 1; }
          done
          mkdir -p rel
          cp "${qemu[@]}" "${ovmf[@]}" rel/
          cp dist/ssdt.aml dist/ssdt-ec.aml dist/hpet.aml dist/wsmt.aml dist/*-applied.diff rel/
          # The installer and kernel tools come from the exact same commit as the artifacts.
          tar -C kernel --exclude='./out' --exclude='./__pycache__' -czf rel/realpc-kernel-tools.tar.gz .
          cp deploy/realpc-setup.sh deploy/install-userspace.sh rel/
          printf '%s\n' "${{ steps.run.outputs.sha }}" > rel/SOURCE-COMMIT
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}" > rel/BUILD-RUN-URL
          ( cd rel && sha256sum ./* > SHA256SUMS )
          ls -la rel

      - name: Tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Open, source-built packages for the pve-emu-realpc stack (PVE 9 / QEMU 11.1.3-4).
          SOURCE-COMMIT and BUILD-RUN-URL identify the exact sources and CI run. The applied
          diffs and SHA256SUMS are included.

          Transactional install on a Proxmox VE 9 host (downloads and verifies this release):
            bash realpc-setup.sh --mode normal --release ${{ steps.tag.outputs.name }} --yes
            bash realpc-setup.sh --mode configvm --vmid VMID --yes
          Manual rollback:
            bash realpc-setup.sh --mode rollback --yes

          The installer requires SHA256SUMS, backs up the exact original packages and their
          hold state, and automatically rolls back an incomplete operation. Keep the work
          directory (/root/realpc by default): it contains the rollback backups.

          host-sensors is available on Intel hosts and includes thermal/performance/RAPL MSRs.
          The optional open Strong mode builds kvm.ko on the host for the exact running kernel;
          it is experimental, affects every VM, and is not boot-tested by CI.

          Detection limits remain: CPUID/VM-exit median latency is still visible on ordinary
          KVM. No release can promise full VM invisibility; run tests/timing_tests on the real
          guest and treat ERROR/incomplete results as a failed test run, not as a pass.
          EOF
          )
          gh release create "${{ steps.tag.outputs.name }}" rel/* \
            -R "$GITHUB_REPOSITORY" -t "${{ steps.tag.outputs.name }}" -n "$notes"
