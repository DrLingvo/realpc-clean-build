name: quality

# Fast fail-closed checks for changes that do not need a full QEMU/OVMF rebuild.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Shell and Python syntax
        run: |
          find . -path './.git' -prune -o -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
          python3 -m compileall -q tools tests kernel

      - name: Unit and fixture tests
        run: |
          python3 -m unittest discover -v -s tests -p 'test_*.py'
          python3 -m unittest -v tests/timing_tests/test_analyze.py
          bash tests/test_setup.sh

      - name: ACPI compiler and namespace checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acpica-tools
          python3 tests/check_acpi.py

      - name: Strong kernel source fallback
        run: |
          script=kernel/build-kvm.sh
          grep -F 'd4439e71d7865ecaa01a48033f96ff8ac1df16f8' "$script"
          grep -F '660d1f05673c4e02cc3c2c056afc0dc14c0075f0' "$script"
          grep -F 'ls-tree HEAD submodules/ubuntu-kernel' "$script"
          grep -F 'patch --batch -p1 -d "$prepared"' "$script"
          grep -F 'export LOCALVERSION=' "$script"
          grep -F -- '--disable LOCALVERSION_AUTO' "$script"
          grep -F 'maxdepth 6' "$script"
          ! grep -E 'git.*(main|master)' "$script"

      - name: Build timing tests with strict warnings
        run: |
          make -C tests/timing_tests clean
          make -C tests/timing_tests -j2 \
            CFLAGS='-O2 -Wall -Wextra -Werror -std=gnu11 -Icommon'

      - name: Verify recipe hash coverage
        run: |
          tools/source-hash.sh > /tmp/realpc-source-hash.txt
          for input in tools/make-logo.py tools/gen-profile.py tools/disk_identity.py \
            tools/vm-config.py tools/chipset_map.py tools/smbios_tables.py \
            tools/consistency_lint.py ci/container-build.sh qemu/host-sensors-device.c \
            seabios/strong-fw-cfg.sh seabios/strong-host-bridge.sh \
            acpi/build-wsmt.py .github/workflows/build.yml; do
            grep -F "  $input" /tmp/realpc-source-hash.txt >/dev/null || {
              echo "$input is missing from the recipe hash" >&2; exit 1;
            }
          done
