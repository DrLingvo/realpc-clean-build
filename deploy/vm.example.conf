# Example Proxmox VM config (/etc/pve/qemu-server/<vmid>.conf) for the open stack.
# Adapted from the author's published myINTELvmconf.txt. Replace UUIDs, MACs, disks and the
# SMBIOS/-cpu values with ones that fit YOUR host. host-sensors=on (added to -cpu) shows the
# host CPU's temperature/MHz/power in the guest (Intel; needs the open host-sensors build).
#
# NOTE: keep the SMBIOS hardware story self-consistent. The example board is a Maxsun
# B760M (LGA1700) and the committed memory profile is DDR4/DIMM. Generate unique values with
# tools/gen-profile.py instead of deploying these example serials/UUID/MAC on multiple VMs.
# Remove host-sensors=on on an AMD host. configvm replaces an existing args: line after backup.
args: -acpitable file=/root/ssdt.aml -acpitable file=/root/ssdt-ec.aml -acpitable file=/root/hpet.aml -cpu host,host-cache-info=on,hypervisor=off,vmware-cpuid-freq=false,enforce=false,host-phys-bits=true,pmu=on,host-sensors=on -smbios type=0,vendor="American Megatrends International LLC.",version=H3.7G,date='02/21/2023',release=3.7 -smbios type=1,manufacturer="Maxsun",product="MS-Terminator B760M",version="VER:H3.7G" -smbios type=2,manufacturer="Maxsun",product="MS-Terminator B760M" -smbios type=3,manufacturer="Maxsun" -smbios type=17,manufacturer="Kingston",part="KF432C16BB/16",speed=3200,serial=66666666,asset="9876543210" -smbios type=4,manufacturer="Intel(R) Corporation",version="12th Gen Intel(R) Core(TM) i7-12700" -smbios type=8 -smbios type=9
bios: ovmf
boot: order=sata0
cores: 8
cpu: host
efidisk0: local:VMID/vm-VMID-disk-0.qcow2,efitype=4m,size=528K
machine: q35
memory: 16384
name: realpc
net0: e1000=XX:XX:XX:XX:XX:XX,bridge=vmbr0
numa: 0
ostype: win10
sata0: local:VMID/vm-VMID-disk-1.raw,size=300G,ssd=1
scsihw: virtio-scsi-single
smbios1: uuid=CHANGE-ME
sockets: 1
vga: vmware
